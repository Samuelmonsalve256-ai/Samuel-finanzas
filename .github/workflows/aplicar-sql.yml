# Aplica solo los cambios de la base de datos (supabase/migraciones) al publicarlos en main,
# y revisa una vez al día por si alguno quedó pendiente. No hay que ejecutar nada a mano.
name: Aplicar cambios en Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/migraciones/**', '.github/scripts/**', '.github/workflows/aplicar-sql.yml']
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios pendientes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: .github/scripts/aplicar-sql.sh
