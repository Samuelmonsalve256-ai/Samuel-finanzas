# Cada domingo guarda una copia de todas tus finanzas en Supabase (bucket privado "respaldos").
# Se conservan los últimos 12 (unos 3 meses). Se ven y descargan en la app: Ajustes → Respaldos.
name: Respaldo semanal

on:
  schedule:
    - cron: '23 14 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  respaldar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guardar respaldo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: .github/scripts/respaldo.sh
